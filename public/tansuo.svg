<svg width="100%" viewBox="0 0 240 390" xmlns="http://www.w3.org/2000/svg" style="background:transparent;max-width:280px">

  <!-- 地面影子 -->
  <ellipse cx="120" cy="344" rx="58" ry="9" fill="#000" opacity="0.13">
    <animate attributeName="rx" values="58;48;58;48;58" keyTimes="0;0.25;0.5;0.75;1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.13;0.08;0.13;0.08;0.13" keyTimes="0;0.25;0.5;0.75;1" dur="1s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 整体身体起伏 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -8; 0 0; 0 -8; 0 0"
      keyTimes="0;0.25;0.5;0.75;1" dur="1s" repeatCount="indefinite"/>

    <!-- ===== 背剑（斜挎长剑） ===== -->
    <g>
      <line x1="108" y1="120" x2="144" y2="252" stroke="#6B4423" stroke-width="9" stroke-linecap="round"/>
      <line x1="98" y1="110" x2="114" y2="126" stroke="#3A2A1A" stroke-width="7" stroke-linecap="round"/>
      <line x1="101" y1="114" x2="115" y2="128" stroke="#C9A14A" stroke-width="5" stroke-linecap="round"/>
      <path d="M106,118 Q98,124 95,134 Q102,130 110,124 Z" fill="#C0392B"/>
    </g>

    <!-- ===== 后侧肢体 ===== -->

    <!-- 后腿 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="26 120 240; -26 120 240; 26 120 240"
        keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
      <path d="M120,240 L127,278 L117,320" stroke="#1A3340" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <ellipse cx="115" cy="322" rx="13" ry="6" fill="#0F2230"/>
    </g>

    <!-- 后臂（深袖） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-22 120 185; 22 120 185; -22 120 185"
        keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
      <path d="M120,185 L112,222" stroke="#1A3340" stroke-width="13"
            stroke-linecap="round" fill="none"/>
      <ellipse cx="112" cy="224" rx="7" ry="5" fill="#0F2230"/>
      <circle cx="112" cy="226" r="5" fill="#F0CDA0"/>
    </g>

    <!-- ===== 长袍躯干 ===== -->
    <path d="M104,185 L136,185 L135,230 L105,230 Z" fill="#2B4A5E"/>
    <!-- 交领 -->
    <path d="M104,185 L120,196 L136,185 L134,200 L120,207 L106,200 Z" fill="#1F3849"/>
    <!-- 腰带 -->
    <rect x="104" y="226" width="32" height="8" rx="1" fill="#C9A14A"/>
    <rect x="117" y="226" width="6" height="8" fill="#A8842F"/>

    <!-- 长袍下摆（飘逸摆动） -->
    <g>
      <animateTransform attributeName="transform" type="skewX"
        values="0; -4; 0; 3; 0" keyTimes="0;0.25;0.5;0.75;1"
        dur="1s" repeatCount="indefinite"/>
      <path d="M105,230 L135,230 L144,305 L96,305 Z" fill="#1F3849"/>
      <path d="M120,230 L135,230 L144,305 L120,305 Z" fill="#2B4A5E" opacity="0.55"/>
      <path d="M120,305 L122,270 L120,230" fill="none" stroke="#3A5A6E" stroke-width="1.5"/>
    </g>

    <!-- ===== 腰间佩刀（刀柄朝前，刀鞘朝后） ===== -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-5 134 229; 6 134 229; -5 134 229"
        keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
      <!-- 刀鞘 -->
      <path d="M134,230 L98,298" stroke="#3A2A1A" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M134,230 L98,298" stroke="#6B4423" stroke-width="4" stroke-linecap="round" fill="none"/>
      <!-- 鞘口金属箍 -->
      <line x1="129" y1="227" x2="139" y2="233" stroke="#C9A14A" stroke-width="3" stroke-linecap="round"/>
      <!-- 刀柄 -->
      <line x1="156" y1="206" x2="134" y2="230" stroke="#3A2A1A" stroke-width="6" stroke-linecap="round"/>
      <line x1="153" y1="209" x2="137" y2="227" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>
      <!-- 护手 -->
      <ellipse cx="134" cy="230" rx="6" ry="3" fill="#C9A14A" transform="rotate(45 134 230)"/>
      <!-- 刀穗垂落 -->
      <path d="M157,206 Q165,211 167,219" stroke="#C0392B" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M167,219 Q169,225 166,231" stroke="#A02828" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- ===== 头部 ===== -->
    <circle cx="120" cy="156" r="18" fill="#F0CDA0"/>

    <!-- 厚重头发层 -->
    <!-- 后脑长发底 -->
    <path d="M101,140 Q96,160 99,176 Q104,170 107,160 Q106,148 101,140 Z" fill="#1A1A2E"/>
    <path d="M139,140 Q144,160 141,176 Q136,170 133,160 Q134,148 139,140 Z" fill="#1A1A2E"/>
    <!-- 顶部蓬松发丝 -->
    <path d="M102,140 Q100,120 112,114 Q120,110 128,114 Q140,120 138,140 Q136,128 128,124 Q120,120 112,124 Q104,128 102,140 Z" fill="#1A1A2E"/>
    <path d="M105,134 Q108,118 120,116 Q132,118 135,134 Q130,126 120,124 Q110,126 105,134 Z" fill="#0F0F1F"/>
    <!-- 刘海盖额 -->
    <path d="M104,148 Q106,138 114,140 Q118,144 120,140 Q122,144 126,140 Q134,138 136,148 Q130,142 120,142 Q110,142 104,148 Z" fill="#1A1A2E"/>
    <path d="M108,146 Q116,142 122,148" stroke="#0F0F1F" stroke-width="1.2" fill="none"/>
    <path d="M124,142 Q130,144 134,146" stroke="#0F0F1F" stroke-width="1.2" fill="none"/>
    <!-- 浓鬓发延伸至耳后下颌 -->
    <path d="M102,148 Q97,162 101,178 Q105,172 108,162 Q107,154 102,148 Z" fill="#1A1A2E"/>
    <path d="M138,148 Q143,162 139,178 Q135,172 132,162 Q133,154 138,148 Z" fill="#1A1A2E"/>
    <path d="M101,172 Q99,180 103,184 Q106,180 106,174 Z" fill="#1A1A2E"/>
    <path d="M139,172 Q141,180 137,184 Q134,180 134,174 Z" fill="#1A1A2E"/>

    <!-- 飘动额前碎发 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-3 118 136; 6 118 136; -3 118 136"
        keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
      <path d="M114,140 Q110,148 112,156" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M116,140 Q114,150 116,158" stroke="#0F0F1F" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- 发髻（加大加厚） -->
    <ellipse cx="120" cy="118" rx="11" ry="9" fill="#1A1A2E"/>
    <ellipse cx="120" cy="116" rx="8" ry="6" fill="#0F0F1F"/>
    <path d="M112,122 Q110,116 114,112 Q120,110 126,112 Q130,116 128,122 Q124,118 120,118 Q116,118 112,122 Z" fill="#1A1A2E"/>
    <!-- 发簪 -->
    <line x1="110" y1="116" x2="130" y2="120" stroke="#C9A14A" stroke-width="2" stroke-linecap="round"/>
    <circle cx="130" cy="120" r="2" fill="#C0392B"/>

    <!-- 耳朵 -->
    <ellipse cx="138" cy="158" rx="3" ry="4" fill="#E8BC8A"/>
    <!-- 剑眉 -->
    <path d="M125,150 L134,147" stroke="#1A1A2E" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 眼睛 -->
    <circle cx="131" cy="156" r="2.2" fill="#3A2A1A"/>
    <!-- 嘴 -->
    <path d="M128,164 L133,164" stroke="#A8704A" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 发带飘动（更长更宽） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="10 112 118; -12 112 118; 10 112 118"
        keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
      <path d="M114,118 Q92,116 78,124 Q88,128 100,127 Q108,124 114,122 Z" fill="#C0392B"/>
      <path d="M114,121 Q94,128 82,140 Q94,136 104,132 Q110,128 114,126 Z" fill="#A02828"/>
      <path d="M116,120 Q98,120 86,114" stroke="#C0392B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- ===== 前侧肢体 ===== -->

    <!-- 前臂（亮袖） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="22 120 185; -22 120 185; 22 120 185"
        keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
      <path d="M120,185 L128,222" stroke="#2B4A5E" stroke-width="13"
            stroke-linecap="round" fill="none"/>
      <ellipse cx="128" cy="224" rx="7" ry="5" fill="#1F3849"/>
      <circle cx="128" cy="226" r="5" fill="#F0CDA0"/>
    </g>

    <!-- 前腿 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-26 120 240; 26 120 240; -26 120 240"
        keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
      <path d="M120,240 L127,278 L117,320" stroke="#2B4A5E" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <ellipse cx="115" cy="322" rx="13" ry="6" fill="#1A1A2E"/>
    </g>

  </g>
</svg>